<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Control | InventarioPro</title>
<link href="../plantilla/plantilla/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
      <li class="breadcrumb-item active" aria-current="page">Panel de Control</li>
    </ol>
  </nav>

  <div class="alert alert-info alert-dismissible fade show" role="alert">
    Bienvenido al panel general del sistema<span id="saludo"></span>.
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 fw-bold mb-0">Panel Operativo</h1>
    <div>
      <button class="btn btn-primary">Mensajes <span class="badge text-bg-danger" id="msgs">0</span></button>
      <button class="btn btn-outline-secondary" onclick="cerrarSesion()">Salir</button>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-4 col-lg-3">
      <div class="list-group">
        <a href="dashboard.html" class="list-group-item list-group-item-action active">Inicio</a>
        <a href="productos.html" class="list-group-item list-group-item-action">Productos</a>
        <a href="#" class="list-group-item list-group-item-action" onclick="verUsuarios();return false;">Usuarios <span class="badge text-bg-secondary float-end" id="nUsers">0</span></a>
      </div>
    </div>
    <div class="col-md-4 col-lg-4">
      <div class="card h-100"><div class="card-body">
        <h2 class="h6 fw-bold">Stock Disponible</h2>
        <span class="badge text-bg-success" id="stock">0 Unidades</span>
      </div></div>
    </div>
    <div class="col-md-4 col-lg-4">
      <div class="card h-100"><div class="card-body">
        <h2 class="h6 fw-bold">Avisos Pendientes</h2>
        <span class="badge text-bg-warning" id="avisos">0 Críticos</span>
      </div></div>
    </div>
  </div>
  <div id="alerta" class="mt-3"></div>
</main>
<script src="../plantilla/plantilla/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
  const u = await requerirSesion();
  if (!u) return;
  document.getElementById('saludo').textContent = ', ' + u.nombres;
  const s = await api('/api/stats');
  stock.textContent = s.enStock + ' Unidades';
  avisos.textContent = s.agotados + ' Críticos';
  msgs.textContent = s.agotados;
  nUsers.textContent = s.usuarios;
})();
function verUsuarios() { alerta('alerta', 'Módulo de usuarios: sesión activa iniciada correctamente.', 'info'); }
</script>
</body>
</html>
