<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos | InventarioPro</title>
<link href="../plantilla/plantilla/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="dashboard.html">Panel de Control</a></li>
      <li class="breadcrumb-item active" aria-current="page">Productos</li>
    </ol>
  </nav>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 fw-bold mb-0">Productos</h1>
    <a href="producto-nuevo.html" class="btn btn-primary">Nuevo producto</a>
  </div>
  <div id="alerta"></div>
  <div class="card"><div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light"><tr><th>SKU</th><th>Producto</th><th>Categorías</th><th>Estado</th><th>Publicado</th><th class="text-end">Acciones</th></tr></thead>
      <tbody id="tabla"></tbody>
    </table>
  </div></div>
</main>
<script src="../plantilla/plantilla/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
  if (!(await requerirSesion())) return;
  const ps = await api('/api/productos');
  tabla.innerHTML = ps.length ? ps.map(p => `
    <tr>
      <td><span class="badge" style="background:${esc(p.etiqueta)}">${esc(p.sku)}</span></td>
      <td>${esc(p.nombre)}</td>
      <td>${p.categorias.map(esc).join(', ')}</td>
      <td>${badgeEstado(p.estado)}</td>
      <td>${p.publicado ? 'Sí' : 'No'}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-warning" href="producto-editar.html?id=${p.id}">Editar</a>
        <a class="btn btn-sm btn-outline-danger" href="producto-eliminar.html?id=${p.id}">Eliminar</a>
      </td></tr>`).join('')
    : '<tr><td colspan="6" class="text-center text-muted py-4">Aún no hay productos. Cree el primero con “Nuevo producto”.</td></tr>';
})();
</script>
</body>
</html>
